name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Unit & Demo API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-demo.txt

      - name: Install demo backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-demo.txt

      - name: Run pure-Python and demo API unit tests
        run: >
          python -m unittest
          tests.test_tracking_and_lanes
          tests.test_driver_advice.TestDriverAdviceDemo
          tests.test_driver_advice.TestJunctionEnvironmentConfig
          -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
